external_components:
  - source:
      type: git
      url: https://github.com/YOUR_GITHUB_USER/YOUR_AQUAMQTT_REPO
      ref: main
    components: [aquamqtt]

esphome:
  name: aquamqtt-v5
  friendly_name: AquaMQTT V5
  min_version: 2026.9.0

esp32:
  board: arduino_nano_esp32
  framework:
    type: esp-idf

logger:
  level: DEBUG
  # Keep the logger off the hardware UARTs used by AquaMQTT.
  hardware_uart: USB_SERIAL_JTAG

# Initial setup is done through the fallback access point.
# Connect to "AquaMQTT V5 Setup" and open the captive portal to enter
# the normal Wi-Fi credentials.
wifi:
  ap:
    ssid: "AquaMQTT V5 Setup"
    password: "aquamqtt-setup"

captive_portal:

api:

ota:
  - platform: esphome
    password: "CHANGE-ME-OTA-PASSWORD"

# Two independent ESPHome UART buses. The V5 MITM needs both sides.
# These GPIOs are the defaults documented for the V5 AquaMQTT hardware:
# MAIN: RX=5, TX=6
# HMI:  RX=7, TX=8
uart:
  - id: main_uart
    baud_rate: 38400
    data_bits: 8
    parity: NONE
    stop_bits: 1
    rx_pin: GPIO5
    tx_pin: GPIO6
    rx_buffer_size: 256

  - id: hmi_uart
    baud_rate: 38400
    data_bits: 8
    parity: NONE
    stop_bits: 1
    rx_pin: GPIO7
    tx_pin: GPIO8
    rx_buffer_size: 256

aquamqtt:
  id: aquamqtt
  mode: mitm

  main_uart_id: main_uart
  hmi_uart_id: hmi_uart

  # The V5 board uses GPIOs 9/10 to control the two level shifters.
  main_enable_tx_pin: GPIO9
  hmi_enable_tx_pin: GPIO10

  # The component also needs to know the physical UART pins so it can
  # temporarily connect the ESP32 UART TX signal to both sides of the
  # one-wire level shifter during transmission.
  main_rx_pin: GPIO5
  main_tx_pin: GPIO6
  hmi_rx_pin: GPIO7
  hmi_tx_pin: GPIO8

  frame_silence_ms: 4
  one_wire_uart: true

